[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "edgar-avatar"
version = "0.1.0"
description = "Efficient Diffusion-Driven Gaussian Avatar Refinement"
readme = "README.md"
license-files = ["LICENSE.txt", "NOTICE", "THIRD_PARTY.md", "licenses/*.txt"]
requires-python = ">=3.9,<3.12"
dependencies = [
  "torch==2.3.1", "torchvision==0.18.1", "numpy<2", "Pillow>=10",
  "diffusers==0.25.1", "transformers==4.38.0", "peft==0.9.0",
  "huggingface-hub==0.25.1", "accelerate==1.9.0", "safetensors>=0.4.3",
  "tqdm>=4.66", "einops>=0.7",
]

[project.optional-dependencies]
train = ["lpips==0.1.4", "timm==1.0.24"]
test = ["pytest>=8,<9"]
avatar = ["numpy==1.23.5", "scipy==1.13.1", "PyYAML>=6,<7", "omegaconf==2.3.0", "roma>=1.5,<2", "plyfile>=1.0,<1.2", "trimesh>=4,<5", "icecream>=2.1"]

[project.scripts]
edgar-infer = "edgar.infer:main"
edgar-train = "edgar.train:main"
edgar-refine-avatar = "edgar.refine_avatar:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
